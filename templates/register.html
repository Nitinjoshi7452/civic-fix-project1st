{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-aside"><span class="eyebrow">JOIN YOUR COMMUNITY</span><h1>Your city.<br>Your voice.</h1><p>Create an account to report local problems and follow their progress.</p></div><form class="form-card" method="post"><h2>Create account</h2><label>Full name<input name="name" required maxlength="80"></label><label>Email address<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required><small>At least 8 characters.</small></label><button class="btn primary full">Create account</button><p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></section>{% endblock %}
